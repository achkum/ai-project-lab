<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Private password setup · Research & Build</title><style>
*{box-sizing:border-box}body{font:16px/1.6 system-ui,sans-serif;background:#edf3f0;color:#173a31;margin:0;padding:8vh 20px}main{max-width:520px;margin:auto;background:white;border:1px solid #ccded5;border-radius:18px;padding:36px;box-shadow:0 15px 60px #153d3010}small{letter-spacing:2px;font-size:11px}h1{font-size:30px;line-height:1.2}p{color:#586e65}label{display:block;margin:18px 0 6px;font-size:14px}input[type=password]{width:100%;padding:13px;border:1px solid #a9c2b5;border-radius:8px;font:inherit}.remember{display:flex;align-items:center;gap:10px}button{width:100%;padding:14px;border:0;border-radius:8px;background:#24674f;color:white;font:600 15px system-ui;margin-top:20px;cursor:pointer}button:disabled{opacity:.5}a{color:#24674f}#message{font-size:14px}form[hidden]{display:none}</style><script src="/password.js" defer></script></head><body><main><small>RESEARCH & BUILD · PRIVATE ACCESS</small><h1 id="heading">Set your dashboard password</h1><p id="intro">Choose your password here. It goes directly to your VPS over HTTPS and is never sent to the chat.</p><form id="password-form"><label for="password">New password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><label for="confirmation">Confirm password</label><input id="confirmation" name="confirmation" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><label class="remember"><input id="remember" type="checkbox">Remember this browser for 30 days</label><button id="submit" type="submit">Set password & open dashboard</button></form><p id="message" role="status">Use at least 12 characters. A memorable passphrase works well.</p><a href="https://achkum.github.io/ai-project-lab/#thesis">Back to dashboard</a></main></body></html>
